[project]
name = "hisui"
description = "CLI package for using Recording Composition Tool Hisui from Python"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Shiguredo Inc.", email = "contact+pypi@shiguredo.jp" }]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Rust",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/shiguredo/hisui"
Repository = "https://github.com/shiguredo/hisui"

[dependency-groups]
dev = ["maturin", "pytest", "ruff", "ty"]

[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[tool.maturin]
bindings = "bin"
python-source = "python"
strip = true

[tool.maturin.target.aarch64-apple-darwin]
macos-deployment-target = "14.0"

[tool.pytest.ini_options]
testpaths = ["python/tests"]

[tool.uv]
package = false
