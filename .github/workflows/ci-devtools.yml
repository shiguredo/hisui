name: ci-devtools

on:
  push:
    branches:
      - main
      - develop
      - "feature/*"
    paths:
      - "devtools/**"
      - ".github/workflows/ci-devtools.yml"
      - "!**.md"
      - "!LICENSE"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "devtools/**"
      - ".github/workflows/ci-devtools.yml"

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: devtools
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: voidzero-dev/setup-vp@2dec1e33f4ab2c6d5bce1b0c4607961bb1a3f7a1 # v1.12.0
        with:
          node-version: "24"
          run-install: true
          working-directory: devtools
      - run: vp check
      - run: vp build
      - run: vp test run

  slack_notify:
    needs:
      - ci
    permissions:
      actions: read
    timeout-minutes: 5
    runs-on: ubuntu-slim
    if: always()
    steps:
      - name: Slack Notification
        uses: shiguredo/github-actions/.github/actions/slack-notify@main
        with:
          status: ${{ job.status }}
          slack_webhook: ${{ secrets.SLACK_WEBHOOK }}
          slack_channel: hisui
          notify_mode: failure_and_fixed
        env:
          GH_TOKEN: ${{ github.token }}
